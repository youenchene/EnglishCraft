# Disposable fixture, distinct from the user's development family.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: englishcraft_test
      POSTGRES_USER: englishcraft
      POSTGRES_PASSWORD: isolated-test-only
    ports: ["127.0.0.1:55433:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U englishcraft -d englishcraft_test"]
      interval: 2s
      timeout: 3s
      retries: 15
  app:
    image: englishcraft-ai-test:local
    environment:
      DATABASE_URL: postgres://englishcraft:isolated-test-only@postgres:5432/englishcraft_test?sslmode=disable
      COOKIE_SECURE: "false"
      AI_PROVIDER: disabled
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
