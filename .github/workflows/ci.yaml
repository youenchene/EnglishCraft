name: EnglishCraft Core
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: englishcraft
          POSTGRES_USER: englishcraft
          POSTGRES_PASSWORD: ci-fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U englishcraft"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://englishcraft:ci-fixture-only@localhost:5432/englishcraft?sslmode=disable
      TEST_DATABASE_URL: postgres://englishcraft:ci-fixture-only@localhost:5432/englishcraft?sslmode=disable
      COOKIE_SECURE: 'false'
      INITIAL_PARENT_USERNAME: parent-ci
      INITIAL_PARENT_PASSWORD: parent-ci-fixture-only
      INITIAL_CHILD_USERNAME: alex-ci
      INITIAL_CHILD_PASSWORD: child-ci-fixture-only
      E2E_PARENT_USERNAME: parent-ci
      E2E_PARENT_PASSWORD: parent-ci-fixture-only
      E2E_CHILD_USERNAME: alex-ci
      E2E_CHILD_PASSWORD: child-ci-fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make build
      - run: make test lint
      - run: go test -race -count=1 ./...
      - run: go test -race -count=1 -tags=integration ./test/integration/...
      - run: make provision
      - run: cd web && npx playwright install --with-deps chromium
      - name: Real browser mission
        run: |
          ./bin/englishcraft > /tmp/englishcraft.log 2>&1 &
          trap 'kill $!' EXIT
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          make test-e2e
