# Optional OpenAI overlay. Supply secrets through the shell, never in this file.
# Local demo: docker compose -p englishcraft-ai-verification -f compose.e2e.yaml -f compose.ai.yaml up -d --wait app
# Development: docker compose -f compose.yaml -f compose.ai.yaml up -d --build --wait app
services:
  app:
    environment:
      AI_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Export your OpenAI API key first}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-gpt-4.1-mini}
      AI_PROVIDER_DAILY_MICROS: ${AI_PROVIDER_DAILY_MICROS:-1000000}
      AI_STUDENT_DAILY_MICROS: ${AI_STUDENT_DAILY_MICROS:-1000000}
      AI_TEXT_RESERVE_MICROS: ${AI_TEXT_RESERVE_MICROS:-50000}
      VOICE_ENABLED: ${VOICE_ENABLED:-false}
      AI_VOICE_MODEL: ${AI_VOICE_MODEL:-gpt-realtime-2.1}
      AI_VOICE_RESERVE_MICROS: ${AI_VOICE_RESERVE_MICROS:-0}
      VOICE_MAX_SECONDS: ${VOICE_MAX_SECONDS:-300}
      VOICE_DAILY_SECONDS: ${VOICE_DAILY_SECONDS:-900}
