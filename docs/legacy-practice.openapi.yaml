openapi: 3.1.0
info:
  title: EnglishCraft API
  version: 0.1.0
  description: Historical contract of the practice prototype. These routes are no longer registered. See api/openapi.yaml for the active API.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /practice/irregular-verbs/next:
    get:
      operationId: getNextIrregularVerbExercise
      summary: Return the next irregular verb recall exercise
      responses:
        "200":
          description: Exercise selected from the curriculum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /practice/irregular-verbs/{verbId}/answers:
    post:
      operationId: submitIrregularVerbAnswer
      summary: Correct an answer and update progress atomically
      parameters:
        - in: path
          name: verbId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: Deterministic correction and updated progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Exercise:
      type: object
      required: [verbId, baseForm, translation, skillId]
      properties:
        verbId: { type: string }
        baseForm: { type: string }
        translation: { type: string }
        skillId: { type: string }
    AnswerInput:
      type: object
      additionalProperties: false
      required: [pastSimple, pastParticiple]
      properties:
        pastSimple: { type: string, minLength: 1, maxLength: 100 }
        pastParticiple: { type: string, minLength: 1, maxLength: 100 }
    AnswerResult:
      type: object
      required: [correct, pastSimpleCorrect, pastParticipleCorrect, expectedPastSimple, expectedPastParticiple, feedback, validationLevel, correctAnswers, totalAnswers, nextReviewAt]
      properties:
        correct: { type: boolean }
        pastSimpleCorrect: { type: boolean }
        pastParticipleCorrect: { type: boolean }
        expectedPastSimple: { type: string }
        expectedPastParticiple: { type: string }
        feedback: { type: string }
        validationLevel: { type: string, enum: [not_started, recognition, recall, context] }
        correctAnswers: { type: integer, minimum: 0 }
        totalAnswers: { type: integer, minimum: 0 }
        nextReviewAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Missing or invalid credentials
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: The authenticated role cannot perform this action
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Exercise not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
